services:
  - type: web
    name: music-web-api
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      # Required on Render dashboard for the backend to start successfully.
      # MONGODB_URI must point to your MongoDB connection string.
      # ACCESS_TOKEN_SECRET and REFRESH_TOKEN_SECRET must be long random secrets.
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://my-music-bice.vercel.app
      - key: SERVER_URL
        value: https://music-web-sqpk.onrender.com
